<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment & UTR Verification</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            text-align: center;
            padding-top: 15px;
            color: #333;
            margin: 0;
        }
        .box {
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            display: inline-block;
            width: 85%;
            max-width: 320px;
        }
        h3 { color: #007BFF; margin-bottom: 5px; font-size: 16px; }
        p { font-size: 12px; color: #555; margin: 6px 0; }
        .qr-container img {
            width: 150px;
            height: 150px;
            border-radius: 6px;
            border: 1px solid #ddd;
            margin-top: 5px;
        }
        .input-group {
            margin-top: 10px;
            text-align: left;
        }
        label { font-size: 11px; font-weight: bold; color: #444; }
        input {
            width: 100%;
            padding: 6px;
            margin-top: 3px;
            margin-bottom: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 12px;
        }
        button {
            background-color: #007BFF;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            font-size: 13px;
        }
        button:hover { background-color: #0056b3; }
        #statusBox {
            margin-top: 10px;
            padding: 8px;
            background: #e9ecef;
            border-radius: 4px;
            font-size: 12px;
        }
        .error-msg {
            color: red;
            font-size: 11px;
            margin-bottom: 5px;
            display: none;
        }
    </style>
</head>
<body>

    <div class="box">
        <h3 id="mainTitle">भुगतान और UTR सत्यापन</h3>
        
        <!-- QR कोड सेक्शन -->
        <div class="qr-container">
            <p><b>QR कोड स्कैन करें:</b></p>
            <img src="https://i.ibb.co/20nfkZzS/qr-image.jpg" alt="Payment QR Code">
        </div>

        <!-- यूजर इनपुट (नाम और UTR) -->
        <div class="input-group">
            <label>आपका नाम (Name):</label>
            <input type="text" id="userNameInput" placeholder="नाम दर्ज करें">
            
            <label>UTR नंबर:</label>
            <input type="text" id="utrInput" placeholder="UTR नंबर दर्ज करें">
            
            <div id="errorText" class="error-msg">कृपया नाम और UTR दोनों दर्ज करना अनिवार्य है!</div>
            
            <button onclick="saveDetails()">डिटेल्स सबमिट करें</button>
        </div>

        <!-- स्टेटस और टाइमर बॉक्स -->
        <div id="statusBox">
            <p id="statusMsg"><b>Status:</b> कृपया डिटेल्स भरकर सबमिट करें</p>
            <p id="timerMsg">प्रतीक्षा की जा रही है...</p>
        </div>
    </div>

    <script>
        const WEB_URL = "https://script.google.com/macros/s/AKfycbyGcTv1TZ45PFwuEw4i-7kUDY6QMdCuyAjPzQRlAa4n-0X3jwS3tTBMrxASW7Kp_SgJMw/exec";

        window.onload = function() {
            if(localStorage.getItem("userName")) {
                document.getElementById("userNameInput").value = localStorage.getItem("userName");
            }
            if(localStorage.getItem("utrNumber")) {
                document.getElementById("utrInput").value = localStorage.getItem("utrNumber");
            }
            // यदि पहले से नाम और UTR सेव हैं, तो तुरंत स्टेटस चेक शुरू कर दें
            if(localStorage.getItem("userName") && localStorage.getItem("utrNumber")) {
                checkPaymentStatus();
            }
        }

        function saveDetails() {
            let name = document.getElementById("userNameInput").value.trim();
            let utr = document.getElementById("utrInput").value.trim();
            let errorBox = document.getElementById("errorText");

            // सख्त जाँच: यदि नाम या UTR खाली है, तो आगे नहीं बढ़ने देगा
            if(name === "" || utr === "") {
                errorBox.style.display = "block";
                return;
            } else {
                errorBox.style.display = "none";
            }

            // लोकल स्टोरेज में सेव करना
            localStorage.setItem("userName", name);
            localStorage.setItem("utrNumber", utr);
            
            document.getElementById("statusMsg").innerHTML = "<b>Status:</b> डिटेल्स सबमिट हो गई हैं। चेक हो रहा है...";
            checkPaymentStatus();
        }

        function checkPaymentStatus() {
            let userName = document.getElementById("userNameInput").value.trim() || localStorage.getItem("userName") || "";
            if(!userName) return;

            fetch(`${WEB_URL}?name=${encodeURIComponent(userName)}`)
                .then(response => {
                    if (!response.ok) throw new Error("Network error");
                    return response.json();
                })
                .then(data => {
                    let status = data.status;
                    let timestamp = data.timestamp;

                    document.getElementById("statusMsg").innerHTML = "<b>Status:</b> " + status;

                    if (status.toLowerCase() === "approved") {
                        if (timestamp) {
                            let approvalTime = new Date(timestamp).getTime();
                            let currentTime = new Date().getTime();
                            let hoursPassed = (currentTime - approvalTime) / (1000 * 60 * 60);

                            if (hoursPassed < 24) {
                                document.getElementById("timerMsg").innerText = "24 घंटे का लॉक सक्रिय है। गेम पर जा रहे हैं...";
                                sendToThunkable("GOTO_GAME");
                            } else {
                                document.getElementById("timerMsg").innerText = "24 घंटे पूरे हो चुके हैं। पुनः भुगतान करें।";
                                sendToThunkable("GOTO_PAYMENT");
                            }
                        } else {
                            document.getElementById("timerMsg").innerText = "अप्रूव हो गया है!";
                            sendToThunkable("GOTO_GAME");
                        }
                    } else {
                        document.getElementById("timerMsg").innerText = "एडमिन द्वारा अप्रूवल बाकी है...";
                    }
                })
                .catch(err => {
                    console.error(err);
                    document.getElementById("statusMsg").innerHTML = "<b>Status:</b> कनेक्शन त्रुटि!";
                    document.getElementById("timerMsg").innerText = "पुनः प्रयास जारी है...";
                });
        }

        // हर 4 सेकंड में ऑटोमैटिक स्टेटस चेक (केवल तब जब नाम और UTR दर्ज हो चुके हों)
        setInterval(function() {
            if(localStorage.getItem("userName") && localStorage.getItem("utrNumber")) {
                checkPaymentStatus();
            }
        }, 4000);
    </script>

</body>
</html>
