<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment & Status Check</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 20px; margin: 0; }
        .container { max-width: 400px; margin: auto; background: #ffffff; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; }
        .qr-box { text-align: center; margin-bottom: 20px; }
        .qr-box img { width: 200px; height: 200px; border-radius: 8px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
        input[type="text"], input[type="number"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background-color: #28a745; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #218838; }
        #status-box { display: none; text-align: center; margin-top: 20px; padding: 20px; background: #e2f0d9; border-radius: 8px; border: 1px solid #c3e6cb; }
        #msg { margin-top: 15px; text-align: center; font-weight: bold; font-size: 15px; }
    </style>
</head>
<body>

<div class="container" id="form-container">
    <h2>Scan & Pay ₹20</h2>
    
    <div class="qr-box">
        <p>QR कोड स्कैन करके पेमेंट करें:</p>
        <img src="https://i.postimg.cc/HxVFHJjX/upi-qr.png" alt="QR Code">
    </div>

    <form onsubmit="event.preventDefault(); submitPaymentData();">
        <div class="form-group">
            <label>Your Name:</label>
            <input type="text" id="name" placeholder="अपना नाम लिखें" required>
        </div>

        <div class="form-group">
            <label>UTR / Transaction ID:</label>
            <input type="text" id="utr" placeholder="UTR नंबर यहाँ डालें" required>
        </div>

        <div class="form-group">
            <label>Amount:</label>
            <input type="number" id="amount" value="20" readonly required>
        </div>

        <button type="submit" id="submit-btn">Submit Payment</button>
    </form>
    <p id="msg"></p>
</div>

<div class="container" id="status-box">
    <h3>⏳ एडमिन अप्रूवल का इंतज़ार है...</h3>
    <p>आपका पेमेंट सबमिट हो गया है। जैसे ही शीट में अप्रूव होगा, ऐप अपने आप खुल जाएगा!</p>
</div>

<script>
// आपका नया और फाइनल Apps Script यूआरएल यहाँ सेट है
var scriptURL = "https://script.google.com/macros/s/AKfycbyPGcu6oBldkzDWS4vXq4yJf9XAEjjECz2y9BeHMpKwS0DnmxfVeJH9p45LRwlB-4yCEg/exec";
var checkTimer = null;

function submitPaymentData() {
    var name = document.getElementById('name').value.trim();
    var utr = document.getElementById('utr').value.trim();
    var amount = document.getElementById('amount').value.trim();
    var msg = document.getElementById('msg');

    msg.style.color = "blue";
    msg.innerText = "डेटा सबमिट हो रहा है...";
    document.getElementById('submit-btn').disabled = true;

    var fullURL = scriptURL + "?name=" + encodeURIComponent(name) + "&utr=" + encodeURIComponent(utr) + "&amount=" + encodeURIComponent(amount);

    fetch(fullURL, {
        method: "POST"
    })
    .then(response => response.text())
    .then(result => {
        document.getElementById('form-container').style.display = 'none';
        document.getElementById('status-box').style.display = 'block';
        startCheckingStatus(utr);
    })
    .catch(error => {
        document.getElementById('form-container').style.display = 'none';
        document.getElementById('status-box').style.display = 'block';
        startCheckingStatus(utr);
    });
}

function startCheckingStatus(utr) {
    if (checkTimer) clearInterval(checkTimer);

    // हर 3 सेकंड में गूगल शीट से स्टेटस चेक करेगा
    checkTimer = setInterval(function() {
        fetch(scriptURL + "?utr=" + encodeURIComponent(utr))
        .then(res => res.json())
        .then(data => {
            console.log("Current Status from Sheet: ", data.status);
            
            if (data.status) {
                var cleanStatus = data.status.toString().trim().toLowerCase();
                
                if (cleanStatus === "approved") {
                    clearInterval(checkTimer);
                    
                    // Thunkable ऐप को "Approved" का सिग्नल भेजने के सभी तरीके
                    try {
                        if (window.ThunkableWebviewerExtension) {
                            ThunkableWebviewerExtension.postMessage("Approved");
                        }
                        if (window.ReactNativeWebView) {
                            window.ReactNativeWebView.postMessage("Approved");
                        }
                        window.parent.postMessage("Approved", "*");
                    } catch(e) {
                        console.log("PostMessage error: ", e);
                    }
                }
            }
        })
        .catch(err => {
            console.log("Checking error: ", err);
        });
    }, 3000);
}

</script>

</body>
</html>
