<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment & 24Hr Lock</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            text-align: center;
            padding-top: 15px;
            color: #333;
            margin: 0;
        }
        .box {
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            display: inline-block;
            width: 85%;
            max-width: 320px;
        }
        h3 { color: #007BFF; margin-bottom: 5px; font-size: 16px; }
        p { font-size: 12px; color: #555; margin: 6px 0; }
        .qr-container img {
            width: 150px;
            height: 150px;
            border-radius: 6px;
            border: 1px solid #ddd;
            margin-top: 5px;
        }
        .input-group {
            margin-top: 10px;
            text-align: left;
        }
        label { font-size: 11px; font-weight: bold; color: #444; }
        input {
            width: 100%;
            padding: 6px;
            margin-top: 3px;
            margin-bottom: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 12px;
        }
        button {
            background-color: #007BFF;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            font-size: 13px;
        }
        button:hover { background-color: #0056b3; }
        
        #screenAlert {
            color: #721c24;
            background-color: #f8d7da;
            border: 1px solid #f5c6cb;
            padding: 8px;
            border-radius: 4px;
            font-size: 12px;
            margin-bottom: 10px;
            display: none;
            text-align: center;
            font-weight: bold;
        }

        #statusBox {
            margin-top: 10px;
            padding: 8px;
            background: #e9ecef;
            border-radius: 4px;
            font-size: 12px;
        }
    </style>
</head>
<body>

    <div class="box">
        <h3>पेमेंट और अप्रूवल</h3>
        
        <div class="qr-container">
            <p><b>QR कोड स्कैन करें:</b></p>
            <img src="https://i.ibb.co/20nfkZzS/qr-image.jpg" alt="QR Code">
        </div>

        <div class="input-group">
            <div id="screenAlert">कृपया अपना नाम और UTR नंबर दोनों दर्ज करें!</div>

            <label>आपका नाम (Name):</label>
            <input type="text" id="userNameInput" placeholder="नाम दर्ज करें">
            
            <label>UTR नंबर:</label>
            <input type="text" id="utrInput" placeholder="UTR नंबर दर्ज करें">
            
            <button onclick="submitDetails()">डेटा सबमिट करें</button>
        </div>

        <div id="statusBox">
            <p id="statusMsg"><b>Status:</b> डिटेल्स भरें</p>
            <p id="timerMsg">प्रतीक्षा की जा रही है...</p>
        </div>
    </div>

    <!-- छिपा हुआ फ्रेम ताकि बिना रुकावट शीट में डेटा जाए -->
    <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;"></iframe>
    <form id="hiddenForm" action="https://script.google.com/macros/s/AKfycbyXFpslYQ6Eu-AwkuHcVvLY3324W__RfsdCTU1eE5lAT2XG8HWDSXJ51qCK6xZZmtjxag/exec" method="GET" target="hidden_iframe" style="display:none;">
        <input type="hidden" name="name" id="formName">
        <input type="hidden" name="utr" id="formUtr">
    </form>

    <script>
        // आपका नया और अपडेटेड Google Apps Script Web App URL
        const WEB_URL = "https://script.google.com/macros/s/AKfycbyXFpslYQ6Eu-AwkuHcVvLY3324W__RfsdCTU1eE5lAT2XG8HWDSXJ51qCK6xZZmtjxag/exec";

        window.onload = function() {
            if(localStorage.getItem("userName")) {
                document.getElementById("userNameInput").value = localStorage.getItem("userName");
                if(localStorage.getItem("utrNumber")) {
                    document.getElementById("utrInput").value = localStorage.getItem("utrNumber");
                }
                checkStatus();
                setInterval(checkStatus, 4000);
            }
        }

        function submitDetails() {
            let name = document.getElementById("userNameInput").value.trim();
            let utr = document.getElementById("utrInput").value.trim();
            let alertBox = document.getElementById("screenAlert");

            if(!name || !utr) {
                alertBox.style.display = "block";
                return;
            } else {
                alertBox.style.display = "none";
            }

            localStorage.setItem("userName", name);
            localStorage.setItem("utrNumber", utr);
            
            document.getElementById("statusMsg").innerHTML = "<b>Status:</b> शीट पर भेजा जा रहा है...";

            // फॉर्म के जरिए चुपचाप गूगल शीट में डेटा भेजना
            document.getElementById("formName").value = name;
            document.getElementById("formUtr").value = utr;
            document.getElementById("hiddenForm").submit();

            setTimeout(function() {
                document.getElementById("statusMsg").innerHTML = "<b>Status:</b> Pending (अप्रूवल का इंतज़ार है)";
                checkStatus();
                setInterval(checkStatus, 4000);
            }, 1500);
        }

        function checkStatus() {
            let name = localStorage.getItem("userName");
            if(!name) return;

            let url = `${WEB_URL}?name=${encodeURIComponent(name)}`;

            fetch(url)
                .then(res => res.json())
                .then(data => {
                    let status = data.status;
                    let timestamp = data.timestamp;

                    document.getElementById("statusMsg").innerHTML = "<b>Status:</b> " + status;

                    if (status.toLowerCase() === "approved") {
                        if (timestamp) {
                            let approvalTime = new Date(timestamp).getTime();
                            let currentTime = new Date().getTime();
                            let hoursPassed = (currentTime - approvalTime) / (1000 * 60 * 60);

                            if (hoursPassed < 24) {
                                document.getElementById("timerMsg").innerText = "24 घंटे का लॉक सक्रिय है। गेम पर जा रहे हैं...";
                                sendToApp("GOTO_GAME");
                            } else {
                                document.getElementById("timerMsg").innerText = "24 घंटे पूरे हो चुके हैं। पुनः भुगतान करें।";
                                sendToApp("GOTO_PAYMENT");
                            }
                        } else {
                            document.getElementById("timerMsg").innerText = "अप्रूव हो गया है!";
                            sendToApp("GOTO_GAME");
                        }
                    } else {
                        document.getElementById("timerMsg").innerText = "Pending: एडमिन अप्रूवल का इंतज़ार है...";
                    }
                })
                .catch(err => {
                    console.log("Checking status...");
                });
        }

        function sendToApp(action) {
            // यह Thunkable या WebView ऐप को मैसेज भेजने के लिए है
            if (window.ReactNativeWebView) {
                window.ReactNativeWebView.postMessage(action);
            } else if (window.parent) {
                window.parent.postMessage(action, "*");
            }
        }
    </script>
</body>
</html>
