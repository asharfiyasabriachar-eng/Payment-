<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment & 24Hr Lock</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            text-align: center;
            padding-top: 15px;
            color: #333;
            margin: 0;
        }
        .box {
            background: #fff;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            display: inline-block;
            width: 85%;
            max-width: 320px;
        }
        h3 { color: #007BFF; margin-bottom: 5px; font-size: 16px; }
        p { font-size: 12px; color: #555; margin: 6px 0; }
        .qr-container img {
            width: 150px;
            height: 150px;
            border-radius: 6px;
            border: 1px solid #ddd;
            margin-top: 5px;
        }
        .input-group {
            margin-top: 10px;
            text-align: left;
        }
        label { font-size: 11px; font-weight: bold; color: #444; }
        input {
            width: 100%;
            padding: 6px;
            margin-top: 3px;
            margin-bottom: 8px;
            box-sizing: border-box;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 12px;
        }
        button {
            background-color: #007BFF;
            color: white;
            border: none;
            padding: 8px 12px;
            border-radius: 4px;
            cursor: pointer;
            width: 100%;
            font-size: 13px;
        }
        button:hover { background-color: #0056b3; }
        
        #screenAlert {
            color: #721c24;
            background-color: #f8d7da;
            border: 1px solid #f5c6cb;
            padding: 8px;
            border-radius: 4px;
            font-size: 12px;
            margin-bottom: 10px;
            display: none;
            text-align: center;
            font-weight: bold;
        }

        #statusBox {
            margin-top: 10px;
            padding: 8px;
            background: #e9ecef;
            border-radius: 4px;
            font-size: 12px;
        }

        #countdown {
            font-size: 14px;
            font-weight: bold;
            color: #28a745;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <div class="box">
        <h3>पेमेंट और अप्रूवल</h3>
        
        <div class="qr-container">
            <p><b>QR कोड स्कैन करें:</b></p>
            <img src="https://i.ibb.co/20nfkZzS/qr-image.jpg" alt="QR Code">
        </div>

        <div class="input-group" id="formGroup">
            <div id="screenAlert">कृपया अपना नाम और UTR नंबर दोनों दर्ज करें!</div>

            <label>आपका नाम (Name):</label>
            <input type="text" id="userNameInput" placeholder="नाम दर्ज करें">
            
            <label>UTR नंबर:</label>
            <input type="text" id="utrInput" placeholder="UTR नंबर दर्ज करें">
            
            <button onclick="submitDetails()">डेटा सबमिट करें</button>
        </div>

        <div id="statusBox">
            <p id="statusMsg"><b>Status:</b> डिटेल्स भरें</p>
            <p id="timerMsg">प्रतीक्षा की जा रही है...</p>
            <div id="countdown"></div>
        </div>
    </div>

    <!-- बैकग्राउंड में डेटा भेजने के लिए iframe और form -->
    <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;"></iframe>
    <form id="hiddenForm" action="https://script.google.com/macros/s/AKfycbzTpAmln0KRVdw4FJOjAWrO4NmFPPiZ8lBsX3CLg4h88Ke33otZ953ijAUm-R-rNIVQug/exec" method="GET" target="hidden_iframe" style="display:none;">
        <input type="hidden" name="name" id="formName">
        <input type="hidden" name="utr" id="formUtr">
    </form>

    <script>
        // आपका नया और अपडेटेड Google Apps Script Web App URL
        const WEB_URL = "https://script.google.com/macros/s/AKfycbzTpAmln0KRVdw4FJOjAWrO4NmFPPiZ8lBsX3CLg4h88Ke33otZ953ijAUm-R-rNIVQug/exec";
        let checkInterval = null;
        let countdownInterval = null;

        // रिफ्रेश होने पर फॉर्म बिल्कुल खाली मिलेगा
        window.onload = function() {
            document.getElementById("userNameInput").value = "";
            document.getElementById("utrInput").value = "";
            sessionStorage.removeItem("activeUser");
        }

        function submitDetails() {
            let name = document.getElementById("userNameInput").value.trim();
            let utr = document.getElementById("utrInput").value.trim();
            let alertBox = document.getElementById("screenAlert");

            if(!name || !utr) {
                alertBox.style.display = "block";
                return;
            } else {
                alertBox.style.display = "none";
            }

            sessionStorage.setItem("activeUser", name);
            
            document.getElementById("statusMsg").innerHTML = "<b>Status:</b> शीट पर भेजा जा रहा है...";

            document.getElementById("formName").value = name;
            document.getElementById("formUtr").value = utr;
            document.getElementById("hiddenForm").submit();

            setTimeout(function() {
                document.getElementById("statusMsg").innerHTML = "<b>Status:</b> Pending (अप्रूवल का इंतज़ार है)";
                if(checkInterval) clearInterval(checkInterval);
                checkStatus();
                checkInterval = setInterval(checkStatus, 4000);
            }, 1500);
        }

        function checkStatus() {
            let name = sessionStorage.getItem("activeUser");
            if(!name) return;

            let url = `${WEB_URL}?name=${encodeURIComponent(name)}`;

            fetch(url)
                .then(res => res.json())
                .then(data => {
                    let status = data.status ? data.status.trim() : "Pending";
                    let timestamp = data.timestamp ? data.timestamp.trim() : "";

                    document.getElementById("statusMsg").innerHTML = "<b>Status:</b> " + status;

                    // यदि स्टेटस Approved या approved हो जाता है
                    if (status.toLowerCase() === "approved") {
                        clearInterval(checkInterval); // स्टेटस चेक करना बंद करें
                        document.getElementById("formGroup").style.display = "none"; // फॉर्म छुपाएं

                        // 24 घंटे का टाइमर शुरू करें
                        let approvalTime = timestamp ? new Date(timestamp).getTime() : new Date().getTime();
                        let expiryTime = approvalTime + (24 * 60 * 60 * 1000);
                        
                        startTimer(expiryTime);

                        document.getElementById("timerMsg").innerText = "सफलतापूर्वक अप्रूव हो गया!";
                        
                        // ऐप/थंकेबल को स्क्रीन बदलने का सिग्नल भेजें
                        sendToApp("GOTO_GAME");
                    } else {
                        document.getElementById("timerMsg").innerText = "Pending: एडमिन अप्रूवल का इंतज़ार है...";
                    }
                })
                .catch(err => {
                    console.log("Checking status...");
                });
        }

        function startTimer(expiryTime) {
            if(countdownInterval) clearInterval(countdownInterval);

            countdownInterval = setInterval(function() {
                let now = new Date().getTime();
                let distance = expiryTime - now;

                if (distance < 0) {
                    clearInterval(countdownInterval);
                    document.getElementById("countdown").innerText = "24 घंटे समाप्त हो चुके हैं!";
                    sendToApp("GOTO_PAYMENT");
                    return;
                }

                let hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                let minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
                let seconds = Math.floor((distance % (1000 * 60)) / 1000);

                document.getElementById("countdown").innerText = `समय शेष: ${hours}h ${minutes}m ${seconds}s`;
            }, 1000);
        }

        function sendToApp(action) {
            if (window.ReactNativeWebView) {
                window.ReactNativeWebView.postMessage(action);
            } else if (window.parent) {
                window.parent.postMessage(action, "*");
            }
        }
    </script>
</body>
</html>
