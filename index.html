<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment & Status Check</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 20px; margin: 0; }
        .container { max-width: 400px; margin: auto; background: #ffffff; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; }
        .qr-box { text-align: center; margin-bottom: 20px; }
        .qr-box img { width: 200px; height: 200px; border-radius: 8px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
        input[type="text"], input[type="number"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background-color: #28a745; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #218838; }
        #status-box { display: none; text-align: center; margin-top: 20px; padding: 20px; background: #e2f0d9; border-radius: 8px; border: 1px solid #c3e6cb; }
        #msg { margin-top: 15px; text-align: center; font-weight: bold; font-size: 15px; }
    </style>
</head>
<body>

<div class="container" id="form-container">
    <h2>Scan & Pay ₹20</h2>
    
    <div class="qr-box">
        <p>QR कोड स्कैन करके पेमेंट करें:</p>
        <img src="https://i.postimg.cc/HxVFHJjX/upi-qr.png" alt="QR Code">
    </div>

    <form onsubmit="event.preventDefault(); sendPayment();">
        <div class="form-group">
            <label>Your Name:</label>
            <input type="text" id="p-name" placeholder="अपना नाम लिखें" required>
        </div>

        <div class="form-group">
            <label>UTR / Transaction ID:</label>
            <input type="text" id="p-utr" placeholder="UTR नंबर यहाँ डालें" required>
        </div>

        <div class="form-group">
            <label>Amount:</label>
            <input type="number" id="p-amount" value="20" readonly required>
        </div>

        <button type="submit" id="submit-btn">Submit Payment</button>
    </form>
    <p id="msg"></p>
</div>

<div class="container" id="status-box">
    <h3>⏳ चेकिंग चल रही है...</h3>
    <p>आपका पेमेंट सबमिट हो गया है। एडमिन द्वारा अप्रूव होते ही ऐप अपने आप खुल जाएगा!</p>
</div>

<script>
// अपना Google Apps Script Web App URL यहाँ ध्यान से जाँच लें
var scriptURL = "https://script.google.com/macros/s/AKfycbyMxeUxdTtgJrq1L1Fb_XL7pYCQjr6UJ4ErF3BBWM76S-DIsNlpM5E0_oViL6yORrkcqA/exec";
var intervalId = null;

function sendPayment() {
    var name = document.getElementById('p-name').value.trim();
    var utr = document.getElementById('p-utr').value.trim();
    var amount = document.getElementById('p-amount').value.trim();
    var msg = document.getElementById('msg');

    msg.style.color = "blue";
    msg.innerText = "डेटा भेजा जा रहा है...";
    document.getElementById('submit-btn').disabled = true;

    var formData = { name: name, utr: utr, amount: amount };

    fetch(scriptURL, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: new URLSearchParams(formData)
    })
    .then(response => {
        document.getElementById('form-container').style.display = 'none';
        document.getElementById('status-box').style.display = 'block';
        
        // तुरंत स्टेटस चेक करना शुरू करें
        startChecking(utr);
    })
    .catch(error => {
        msg.style.color = "red";
        msg.innerText = "एरर आ गया, दोबारा कोशिश करें!";
        document.getElementById('submit-btn').disabled = false;
    });
}

function startChecking(utr) {
    if (intervalId) clearInterval(intervalId);

    // हर 3 सेकंड में गूगल शीट से स्टेटस चेक करेगा
    intervalId = setInterval(function() {
        fetch(scriptURL + "?utr=" + encodeURIComponent(utr))
        .then(res => res.json())
        .then(data => {
            if (data.status && data.status.trim().toLowerCase() === "approved") {
                clearInterval(intervalId);
                
                // Thunkable ऐप को 'Approved' सिग्नल भेजें
                try {
                    if (window.ThunkableWebviewerExtension) {
                        ThunkableWebviewerExtension.postMessage("Approved");
                    } else if (window.ReactNativeWebView) {
                        window.ReactNativeWebView.postMessage("Approved");
                    } else {
                        window.postMessage("Approved", "*");
                    }
                } catch(e) {
                    console.log(e);
                }
            }
        })
        .catch(err => console.log(err));
    }, 3000);
}
</script>

</body>
</html>
