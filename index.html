<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment & Approval Screen</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .card {
            background: rgba(30, 41, 59, 0.95);
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.6);
            width: 340px;
            text-align: center;
            border: 2px solid #facc15;
        }
        h2 { color: #facc15; margin-bottom: 5px; font-size: 20px; }
        .qr-box {
            background: #fff;
            padding: 8px;
            border-radius: 10px;
            display: inline-block;
            margin: 5px 0;
        }
        .qr-box img {
            width: 130px;
            height: 130px;
            object-fit: contain;
        }
        input[type="text"] {
            width: 90%;
            padding: 9px;
            margin: 6px 0;
            border: 2px solid #facc15;
            background: #020617;
            color: #fff;
            border-radius: 8px;
            text-align: center;
            font-size: 14px;
            outline: none;
        }
        .action-btn {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: #fff;
            border: none;
            padding: 11px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-top: 5px;
            box-shadow: 0 4px 10px rgba(34, 197, 94, 0.4);
        }
        .msg {
            font-size: 13px;
            font-weight: bold;
            margin-top: 8px;
            padding: 8px;
            border-radius: 6px;
        }
    </style>
</head>
<body>

    <div class="card">
        <!-- पेमेंट और QR कोड वाली पहली स्क्रीन -->
        <div id="paymentFormSection">
            <h2>भुगतान करें (Payment)</h2>
            <p style="font-size: 11px; color: #94a3b8; margin-top: 0;">QR कोड स्कैन करें और सही विवरण भरें।</p>

            <div class="qr-box">
                <img src="https://i.ibb.co/W474r907/qr-code.png" alt="QR Code">
            </div>

            <form id="utrForm" action="https://script.google.com/macros/s/AKfycbwgnnCRiA775TL4MlaiTBrZZ3tIn9668-4_RaEeSxxsS_xrGVFzv6YtKmaEnrFC71RW-A/exec" method="POST" target="hidden_iframe" onsubmit="return handleFormSubmit()">
                <input type="text" id="nameInput" name="playerName" placeholder="अपना पूरा नाम दर्ज करें" required>
                <input type="text" id="utrInput" name="utr" placeholder="12 अंकों का UTR नंबर दर्ज करें" required>
                <button type="submit" class="action-btn">UTR जमा करें</button>
            </form>
            <div id="statusMsg" class="msg"></div>
        </div>

        <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;"></iframe>
    </div>

    <script>
        let scriptAPIURL = "https://script.google.com/macros/s/AKfycbwgnnCRiA775TL4MlaiTBrZZ3tIn9668-4_RaEeSxxsS_xrGVFzv6YtKmaEnrFC71RW-A/exec";
        let secondScreenURL = "https://asharfiyasabriachar-eng.github.io/Coine-toss2/";

        window.onload = function() {
            let savedName = localStorage.getItem("mine_player_name");
            let savedExpiry = localStorage.getItem("mine_expiry_time");

            // यदि पहले से 24 घंटे का टाइमर चल रहा है, तो चेक करो कि समय बचा है या खत्म हुआ
            if (savedExpiry) {
                let timeLeft = parseInt(savedExpiry) - new Date().getTime();
                if (timeLeft > 0) {
                    // अगर समय बचा है, तो सीधे दूसरी स्क्रीन पर भेज दो
                    window.location.href = secondScreenURL;
                    return;
                } else {
                    // 24 घंटे पूरे हो चुके हैं, डेटा साफ़ करो ताकि वापस पेमेंट स्क्रीन दिखे
                    localStorage.removeItem("mine_player_name");
                    localStorage.removeItem("mine_expiry_time");
                }
            }

            // यदि नाम सेव है लेकिन अभी अप्रूव नहीं हुआ, तो स्टेटस चेक करना जारी रखो
            if (savedName) {
                document.getElementById("nameInput").value = savedName;
                showWaitingMessage("⏳ UTR जमा है, एडमिन के अप्रूवल का इंतज़ार है...");
                checkUserStatus(savedName);
                setInterval(() => checkUserStatus(savedName), 10000);
            }
        };

        function handleFormSubmit() {
            let nameVal = document.getElementById("nameInput").value.trim();
            let utrVal = document.getElementById("utrInput").value.trim();
            let msgBox = document.getElementById("statusMsg");

            let utrRegex = /^\d{12}$/;
            if (!utrRegex.test(utrVal)) {
                msgBox.style.color = "#ef4444";
                msgBox.innerText = "❌ कृपया केवल 12 अंकों का सही UTR नंबर दर्ज करें!";
                return false; 
            }

            localStorage.setItem("mine_player_name", nameVal);
            showWaitingMessage("✅ UTR जमा हो गया! अप्रूवल का इंतज़ार है...");

            setTimeout(() => {
                checkUserStatus(nameVal);
                setInterval(() => checkUserStatus(nameVal), 10000);
            }, 1000);

            return true;
        }

        function showWaitingMessage(text) {
            let msgBox = document.getElementById("statusMsg");
            msgBox.style.color = "#facc15";
            msgBox.style.background = "rgba(234, 179, 8, 0.1)";
            msgBox.innerText = text;
        }

        function checkUserStatus(playerName) {
            if (!playerName) return;
            
            let oldScript = document.getElementById("dynamic_check_script");
            if (oldScript) oldScript.remove();

            let cbName = 'check_cb_' + Date.now();
            let checkURL = scriptAPIURL + "?playerName=" + encodeURIComponent(playerName) + "&callback=" + cbName;

            window[cbName] = function(data) {
                if (data && data.status === "Approved") {
                    let approvalTime = new Date(data.timestamp).getTime();
                    if (isNaN(approvalTime)) approvalTime = new Date().getTime();
                    
                    // 24 घंटे का एक्सपायरी टाइम सेट करना
                    let expiryTime = approvalTime + (24 * 60 * 60 * 1000);
                    localStorage.setItem("mine_expiry_time", expiryTime);
                    
                    // **यहाँ आपकी दूसरी स्क्रीन खुल जाएगी!**
                    window.location.href = secondScreenURL;
                }
                delete window[cbName];
            };

            let script = document.createElement('script');
            script.id = "dynamic_check_script";
            script.src = checkURL;
            document.body.appendChild(script);
        }
    </script>
</body>
</html>
