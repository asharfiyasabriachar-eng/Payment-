<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment & Approval Screen</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .card {
            background: rgba(30, 41, 59, 0.95);
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.6);
            width: 340px;
            text-align: center;
            border: 2px solid #facc15;
        }
        h2 { color: #facc15; margin-bottom: 5px; font-size: 20px; }
        .qr-box {
            background: #fff;
            padding: 8px;
            border-radius: 10px;
            display: inline-block;
            margin: 5px 0;
        }
        .qr-box img {
            width: 120px;
            height: 120px;
            object-fit: contain;
        }
        input[type="text"] {
            width: 90%;
            padding: 9px;
            margin: 6px 0;
            border: 2px solid #facc15;
            background: #020617;
            color: #fff;
            border-radius: 8px;
            text-align: center;
            font-size: 14px;
            outline: none;
        }
        .action-btn {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: #fff;
            border: none;
            padding: 11px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-top: 5px;
            box-shadow: 0 4px 10px rgba(34, 197, 94, 0.4);
        }
        .msg {
            font-size: 12px;
            font-weight: bold;
            margin-top: 5px;
            padding: 6px;
            border-radius: 6px;
        }
        #timerSection { display: none; }
    </style>
</head>
<body>

    <div class="card">
        <h2>भुगतान करें (Payment)</h2>
        <p style="font-size: 11px; color: #94a3b8; margin-top: 0;">QR कोड स्कैन करें, नाम और UTR दर्ज करें।</p>

        <!-- QR कोड -->
        <div class="qr-box">
            <img src="https://i.ibb.co/W474r907/qr-code.png" alt="QR Code">
        </div>

        <!-- UTR फॉर्म -->
        <div id="paymentFormSection">
            <form id="payForm" action="https://docs.google.com/forms/d/e/1FAIpQLSfwS1_ArpcX1dWvcZF12uWscCEBfDLej9k-1xEqNmareS5XgA/formResponse" method="POST" target="hidden_iframe" onsubmit="handleFormSubmit()">
                <input type="text" id="nameInput" name="entry.96567469" required placeholder="अपना नाम दर्ज करें">
                <input type="text" id="utrInput" name="entry.119559036" required placeholder="12 अंकों का UTR नंबर दर्ज करें">
                <button type="submit" class="action-btn">UTR जमा करें</button>
            </form>
            <div id="statusMsg" class="msg"></div>
        </div>

        <!-- पेंडिंग / टाइमर स्क्रीन -->
        <div id="timerSection">
            <div id="infoMessage" class="msg" style="background: rgba(234, 179, 8, 0.2); color: #fde047;">कृपया एडमिन के अप्रूवल का इंतज़ार करें...</div>
            <h3 id="countdownDisplay" style="color: #4ade80; font-size: 20px; margin: 10px 0; display: none;">--:--:--</h3>
        </div>
    </div>

    <!-- हिडन आईफ्रेम -->
    <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;"></iframe>

    <script>
        // आपका बिल्कुल नया और अपडेटेड Apps Script Web App URL
        let statusCheckURL = "https://script.google.com/macros/s/AKfycbwFTxZtqiIanci8rDGVHCXLLiGDATwLk6E3oXMjVvKc6RYJ4054-djTz4rGg35v9ml-ug/exec";

        window.onload = function() {
            let savedName = localStorage.getItem("mine_player_name");
            if (savedName) {
                document.getElementById("nameInput").value = savedName;
                checkUserStatus(savedName);
                setInterval(() => checkUserStatus(savedName), 10000);
            }
        };

        function handleFormSubmit() {
            let nameVal = document.getElementById("nameInput").value.trim();
            localStorage.setItem("mine_player_name", nameVal);
            
            let msgBox = document.getElementById("statusMsg");
            msgBox.style.color = "#4ade80";
            msgBox.innerText = "UTR सफलतापूर्वक दर्ज हो गया!";

            setTimeout(() => {
                switchToWaitingMode();
                setInterval(() => checkUserStatus(nameVal), 10000);
            }, 1500);
        }

        function switchToWaitingMode() {
            document.getElementById("paymentFormSection").style.display = "none";
            document.getElementById("timerSection").style.display = "block";
        }

        function checkUserStatus(playerName) {
            if (!playerName) return;
            let checkURL = statusCheckURL + "?playerName=" + encodeURIComponent(playerName);

            fetch(checkURL)
                .then(res => res.json())
                .then(data => {
                    if (data.status === "Pending") {
                        switchToWaitingMode();
                    } else if (data.status === "Approved") {
                        start24HourTimer(data.timestamp);
                    }
                })
                .catch(err => console.log(err));
        }

        function start24HourTimer(approvalTimeString) {
            document.getElementById("paymentFormSection").style.display = "none";
            document.getElementById("timerSection").style.display = "block";
            document.getElementById("countdownDisplay").style.display = "block";
            document.getElementById("infoMessage").innerText = "✅ आपका पेमेंट अप्रूव हो गया है! टाइमर:";

            let approvalTime = new Date(approvalTimeString).getTime();
            let expiryTime = approvalTime + (24 * 60 * 60 * 1000);

            let timerInterval = setInterval(() => {
                let now = new Date().getTime();
                let timeLeft = expiryTime - now;

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    localStorage.removeItem("mine_player_name");
                    location.reload();
                } else {
                    let hours = Math.floor((timeLeft % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                    let minutes = Math.floor((timeLeft % (1000 * 60 * 60)) / (1000 * 60));
                    let seconds = Math.floor((timeLeft % (1000 * 60)) / 1000);

                    document.getElementById("countdownDisplay").innerText = 
                        hours.toString().padStart(2, '0') + ":" + 
                        minutes.toString().padStart(2, '0') + ":" + 
                        seconds.toString().padStart(2, '0');
                }
            }, 1000);
        }
    </script>
</body>
</html>
