<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Screen</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; padding: 20px; margin: 0; }
        .container { max-width: 400px; margin: auto; background: #ffffff; padding: 20px; border-radius: 10px; box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; }
        .qr-box { text-align: center; margin-bottom: 20px; }
        .qr-box img { width: 200px; height: 200px; border-radius: 8px; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: bold; color: #555; }
        input[type="text"], input[type="number"] { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background-color: #28a745; color: white; border: none; border-radius: 5px; font-size: 16px; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #218838; }
        #response-msg { margin-top: 15px; text-align: center; font-weight: bold; }
    </style>
</head>
<body>

<div class="container">
    <h2>Scan & Pay ₹20</h2>
    
    <div class="qr-box">
        <p>QR कोड स्कैन करके ₹20 पेमेंट करें:</p>
        <img src="https://i.postimg.cc/HxVFHJjX/upi-qr.png" alt="Payment QR Code">
    </div>

    <form onsubmit="event.preventDefault(); submitData();">
        <div class="form-group">
            <label for="name">Your Name:</label>
            <input type="text" id="name" placeholder="अपना नाम लिखें" required>
        </div>

        <div class="form-group">
            <label for="utr">UTR / Transaction ID:</label>
            <input type="text" id="utr" placeholder="UTR नंबर यहाँ डालें" required>
        </div>

        <div class="form-group">
            <label for="amount">Amount:</label>
            <input type="number" id="amount" value="20" readonly required>
        </div>

        <button type="submit" id="submit-btn">Submit Payment</button>
    </form>

    <p id="response-msg"></p>
</div>

<script>
// अपना सही Google Apps Script Web App URL यहाँ सुनिश्चित कर लें
var url = "https://script.google.com/macros/s/AKfycbyMxeUxdTtgJrq1L1Fb_XL7pYCQjr6UJ4ErF3BBWM76S-DIsNlpM5E0_oViL6yORrkcqA/exec";
var checkInterval = null;

function submitData() {
    var name = document.getElementById('name').value.trim();
    var utr = document.getElementById('utr').value.trim();
    var amount = document.getElementById('amount').value.trim();
    var msg = document.getElementById('response-msg');

    if (!name || !utr || !amount) {
        msg.style.color = "red";
        msg.innerText = "कृपया सभी जानकारी भरें!";
        return;
    }

    msg.style.color = "blue";
    msg.innerText = "सबमिट हो रहा है...";
    document.getElementById('submit-btn').disabled = true;

    var data = { name: name, utr: utr, amount: amount };

    fetch(url, {
        method: "POST",
        mode: "no-cors",
        headers: { "Content-Type": "application/x-www-form-urlencoded" },
        body: new URLSearchParams(data)
    })
    .then(response => {
        msg.style.color = "orange";
        msg.innerText = "पेमेंट सबमिट हो गया! एडमिन अप्रूवल का इंतज़ार है...";
        startStatusChecking(utr);
    })
    .catch(error => {
        msg.style.color = "red";
        msg.innerText = "सबमिट करने में समस्या आई!";
        document.getElementById('submit-btn').disabled = false;
    });
}

function startStatusChecking(utr) {
    if (checkInterval) clearInterval(checkInterval);

    checkInterval = setInterval(function() {
        fetch(url + "?utr=" + encodeURIComponent(utr))
        .then(res => res.json())
        .then(data => {
            // यहाँ चेक कर रहे हैं कि स्टेटस "Approved" हुआ या नहीं
            if (data.status && data.status.trim().toLowerCase() === "approved") {
                clearInterval(checkInterval);
                document.getElementById('response-msg').style.color = "green";
                document.getElementById('response-msg').innerText = "पेमेंट अप्रूव हो गया है!";

                // थंकेबल ऐप को मैसेज भेजने के दोनों सही तरीके यहाँ लिखे गए हैं
                try {
                    if (window.ThunkableWebviewerExtension) {
                        ThunkableWebviewerExtension.postMessage("Approved");
                    } else if (window.ReactNativeWebView) {
                        window.ReactNativeWebView.postMessage("Approved");
                    } else {
                        window.postMessage("Approved", "*");
                    }
                } catch(e) {
                    console.log(e);
                }
            }
        })
        .catch(err => console.log(err));
    }, 3000);
}
</script>

</body>
</html>
