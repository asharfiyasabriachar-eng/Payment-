<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment & Game Lock</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            text-align: center;
            padding: 50px;
            color: #333;
        }
        .container {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            display: inline-block;
        }
        h3 { color: #007BFF; }
    </style>
</head>
<body>

    <div class="container">
        <h3 id="statusText">स्टेटس चेक किया जा रहा है...</h3>
        <p id="timerText"></p>
    </div>

    <script>
        // यहाँ आपका दिया गया Google Apps Script Web App URL है
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycby49-NodUjFEF8CeJpJPGbNXYvBBqqLgfXb_Tqp99fOsnxiWtsP8xT1WaukEscKQ5TODg/exec";
        
        // यूजर का नाम (इसे थंकेबल से पास किया जा सकता है या लोकल स्टोरेज से लिया जा सकता है)
        // अभी के लिए इसे डायनामिक या टेस्ट नेम पर सेट कर सकते हैं
        const userName = localStorage.getItem("userName") || "User1"; 

        function checkStatus() {
            fetch(`${WEB_APP_URL}?name=${encodeURIComponent(userName)}`)
                .then(response => response.json())
                .then(data => {
                    let status = data.status;
                    let timestampStr = data.timestamp;

                    document.getElementById("statusText").innerText = "Status: " + status;

                    if (status.toLowerCase() === "approved") {
                        if (timestampStr) {
                            let approvalTime = new Date(timestampStr).getTime();
                            let currentTime = new Date().getTime();
                            let hoursElapsed = (currentTime - approvalTime) / (1000 * 60 * 60);

                            if (hoursElapsed < 24) {
                                document.getElementById("timerText").innerText = "24 घंटे का लॉक सक्रिय है। गेम पर रीडायरेक्ट हो रहा है...";
                                
                                // थंकेबल को स्क्रीन बदलने का सिग्नल भेजना (window.ReactNativeWebView या PostMessage के जरिए)
                                sendDataToThunkable("GOTO_GAME_SCREEN");
                            } else {
                                document.getElementById("timerText").innerText = "24 घंटे पूरे हो चुके हैं। कृपया पुनः भुगतान करें।";
                                sendDataToThunkable("GOTO_PAYMENT_SCREEN");
                            }
                        } else {
                            // अगर टाइमस्टैम्प नहीं है लेकिन अप्रूव्ड है
                            sendDataToThunkable("GOTO_GAME_SCREEN");
                        }
                    } else {
                        document.getElementById("timerText").innerText = "कृपया एडमिन की स्वीकृति (Approval) की प्रतीक्षा करें...";
                    }
                })
                .catch(error => {
                    console.error("Error fetching data:", error);
                    document.getElementById("statusText").innerText = "कनेक्शन त्रुटि। पुनः प्रयास कर रहा है...";
                });
        }

        function sendDataToThunkable(action) {
            if (window.ReactNativeWebView) {
                window.ReactNativeWebView.postMessage(action);
            }
        }

        // हर 5 सेकंड में स्टेटस चेक करते रहें
        setInterval(checkStatus, 5000);
        checkStatus(); // पहली बार तुरंत रन हो
    </script>

</body>
</html>
