<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment Screen</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            padding: 20px;
            margin: 0;
        }
        .container {
            max-width: 400px;
            margin: auto;
            background: #ffffff;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h2 {
            text-align: center;
            color: #333;
        }
        .qr-box {
            text-align: center;
            margin-bottom: 20px;
        }
        .qr-box img {
            width: 200px;
            height: 200px;
            border-radius: 8px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            color: #555;
        }
        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background-color: #218838;
        }
        #response-msg {
            margin-top: 15px;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Scan & Pay ₹20</h2>
    
    <div class="qr-box">
        <p>QR कोड स्कैन करके ₹20 पेमेंट करें:</p>
        <img src="https://i.postimg.cc/HxVFHJjX/upi-qr.png" alt="Payment QR Code" id="qr-img">
    </div>

    <form onsubmit="event.preventDefault(); submitData();">
        <div class="form-group">
            <label for="name">Your Name:</label>
            <input type="text" id="name" placeholder="अपना नाम लिखें" required>
        </div>

        <div class="form-group">
            <label for="utr">UTR / Transaction ID:</label>
            <input type="text" id="utr" placeholder="UTR नंबर यहाँ डालें" required>
        </div>

        <div class="form-group">
            <label for="amount">Amount:</label>
            <input type="number" id="amount" value="20" readonly required>
        </div>

        <button type="submit">Submit Payment</button>
    </form>

    <p id="response-msg"></p>
</div>

<script>
function submitData() {
    var name = document.getElementById('name').value.trim();
    var utr = document.getElementById('utr').value.trim();
    var amount = document.getElementById('amount').value.trim();
    var msg = document.getElementById('response-msg');

    if (!name || !utr || !amount) {
        msg.style.color = "red";
        msg.innerText = "कृपया सभी जानकारी भरें!";
        return;
    }

    msg.style.color = "blue";
    msg.innerText = "Submitting...";

    // आपका नया डिप्लॉयड Web App URL
    var url = "https://script.google.com/macros/s/AKfycbyMxeUxdTtgJrq1L1Fb_XL7pYCQjr6UJ4ErF3BBWM76S-DIsNlpM5E0_oViL6yORrkcqA/exec";

    var data = {
        name: name,
        utr: utr,
        amount: amount
    };

    fetch(url, {
        method: "POST",
        mode: "no-cors",
        headers: {
            "Content-Type": "application/x-www-form-urlencoded",
        },
        body: new URLSearchParams(data)
    })
    .then(response => {
        if (window.ThunkableWebviewerExtension) {
            ThunkableWebviewerExtension.postMessage(utr);
        }
        msg.style.color = "green";
        msg.innerText = "सफलतापूर्वक सबमिट हो गया! एडमिन के अप्रूवल का इंतजार करें।";
        document.getElementById('name').value = '';
        document.getElementById('utr').value = '';
    })
    .catch(error => {
        msg.style.color = "red";
        msg.innerText = "सबमिट करने में भूल हो गई!";
    });
}
</script>

</body>
</html>
