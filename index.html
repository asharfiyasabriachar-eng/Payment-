<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment & Approval Screen</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1e293b);
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .card {
            background: rgba(30, 41, 59, 0.95);
            padding: 20px;
            border-radius: 20px;
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.6);
            width: 340px;
            text-align: center;
            border: 2px solid #facc15;
        }
        h2 { color: #facc15; margin-bottom: 10px; }
        .qr-box {
            background: #fff;
            padding: 10px;
            border-radius: 10px;
            display: inline-block;
            margin: 10px 0;
        }
        .qr-box img {
            width: 150px;
            height: 150px;
            object-fit: contain;
        }
        input[type="text"] {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            border: 2px solid #facc15;
            background: #020617;
            color: #fff;
            border-radius: 8px;
            text-align: center;
            font-size: 14px;
            outline: none;
        }
        .action-btn {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: #fff;
            border: none;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            width: 100%;
            margin-top: 5px;
            box-shadow: 0 4px 10px rgba(34, 197, 94, 0.4);
        }
        .msg {
            font-size: 13px;
            font-weight: bold;
            margin-top: 10px;
            padding: 8px;
            border-radius: 6px;
        }
        #timerSection { display: none; }
    </style>
</head>
<body>

    <div class="card">
        <h2>भुगतान करें (Payment)</h2>
        <p style="font-size: 12px; color: #94a3b8;">नीचे दिए गए QR कोड पर स्कैन करके पेमेंट करें और UTR नंबर दर्ज करें।</p>

        <!-- QR कोड इमेज -->
        <div class="qr-box">
            <img src="https://i.ibb.co/W474r907/qr-code.png" alt="QR Code">
        </div>

        <!-- UTR फॉर्म स्क्रीन -->
        <div id="paymentFormSection">
            <input type="text" id="utrInput" placeholder="12 अंकों का UTR नंबर दर्ज करें">
            <button class="action-btn" onclick="submitUTR()">UTR जमा करें</button>
            <div id="statusMsg" class="msg"></div>
        </div>

        <!-- पेंडिंग / टाइमर स्क्रीन -->
        <div id="timerSection">
            <div id="infoMessage" class="msg" style="background: rgba(234, 179, 8, 0.2); color: #fde047;"></div>
            <h3 id="countdownDisplay" style="color: #4ade80; font-size: 22px; margin: 15px 0;">--:--:--</h3>
        </div>
    </div>

    <!-- डेटा भेजने के लिए फॉर्म -->
    <iframe name="hidden_iframe" id="hidden_iframe" style="display:none;"></iframe>
    <form id="dataForm" action="https://script.google.com/macros/s/AKfycbzjGj8xM0Gmhh9Ky1lqbJAIVVwhbCdRJBR8U_NW-gDP0Vg6vmKZhuC4bh0rW7slpRHW-w/exec" method="POST" target="hidden_iframe" style="display:none;">
        <input type="text" name="playerName" id="formPlayerName">
        <input type="text" name="utr" id="formUtr">
        <input type="text" name="status" id="formStatus">
    </form>

    <script>
        let scriptURL = "https://script.google.com/macros/s/AKfycbzjGj8xM0Gmhh9Ky1lqbJAIVVwhbCdRJBR8U_NW-gDP0Vg6vmKZhuC4bh0rW7slpRHW-w/exec";
        let playerName = localStorage.getItem("mine_player_name") || "User_" + Math.floor(Math.random() * 1000);
        localStorage.setItem("mine_player_name", playerName);

        // पेज खुलते ही शीट चेक करेगा
        window.onload = function() {
            checkUserStatus();
            setInterval(checkUserStatus, 10000); // हर 10 सेकंड में ऑटो-चेक करेगा
        };

        function submitUTR() {
            let utr = document.getElementById("utrInput").value.trim();
            if(!utr) {
                let msgBox = document.getElementById("statusMsg");
                msgBox.style.color = "#f87171";
                msgBox.innerText = "कृपया पहले UTR नंबर लिखें!";
                return;
            }

            document.getElementById("statusMsg").style.color = "#4ade80";
            document.getElementById("statusMsg").innerText = "UTR दर्ज हो गया! अब अप्रूवल का इंतजार करिए...";

            // डेटा गूगल शीट में भेजें (Pending स्टेटस के साथ)
            document.getElementById("formPlayerName").value = playerName;
            document.getElementById("formUtr").value = utr;
            document.getElementById("formStatus").value = "Pending";
            document.getElementById("dataForm").submit();

            setTimeout(switchToWaitingMode, 1500);
        }

        function switchToWaitingMode() {
            document.getElementById("paymentFormSection").style.display = "none";
            document.getElementById("timerSection").style.display = "block";
            document.getElementById("infoMessage").innerText = "कृपया अप्रूवर का इंतजार करिए। एडमिन के अप्रूव करते ही गेम शुरू हो जाएगा!";
            document.getElementById("countdownDisplay").style.display = "none";
        }

        function checkUserStatus() {
            fetch(scriptURL + "?playerName=" + encodeURIComponent(playerName))
                .then(res => res.json())
                .then(data => {
                    if (data.status === "Pending") {
                        switchToWaitingMode();
                    } 
                    else if (data.status === "Approved") {
                        // जैसे ही शीट में Approved हो, 24 घंटे का बैकग्राउंड टाइमर चालू हो जाएगा
                        start24HourTimer(data.timestamp);
                    }
                })
                .catch(err => console.log(err));
        }

        function start24HourTimer(approvalTimeString) {
            document.getElementById("paymentFormSection").style.display = "none";
            document.getElementById("timerSection").style.display = "block";
            document.getElementById("countdownDisplay").style.display = "block";
            document.getElementById("infoMessage").innerText = "✅ आपका पेमेंट अप्रूव हो गया है! टाइमर:";

            let approvalTime = new Date(approvalTimeString).getTime();
            let expiryTime = approvalTime + (24 * 60 * 60 * 1000); // 24 घंटे का समय

            let timerInterval = setInterval(() => {
                let now = new Date().getTime();
                let timeLeft = expiryTime - now;

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    localStorage.removeItem("mine_approved_time");
                    location.reload(); // 24 घंटे बाद वापस पेमेंट स्क्रीन आ जाएगी
                } else {
                    let hours = Math.floor((timeLeft % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                    let minutes = Math.floor((timeLeft % (1000 * 60 * 60)) / (1000 * 60));
                    let seconds = Math.floor((timeLeft % (1000 * 60)) / 1000);

                    document.getElementById("countdownDisplay").innerText = 
                        hours.toString().padStart(2, '0') + ":" + 
                        minutes.toString().padStart(2, '0') + ":" + 
                        seconds.toString().padStart(2, '0');
                }
            }, 1000);
        }
    </script>
</body>
</html>
